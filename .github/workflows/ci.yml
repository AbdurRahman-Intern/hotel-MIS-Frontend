name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel an older run of the same branch/PR when a newer commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json says and fails if
      # package.json and the lockfile disagree. That is what we want in CI.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Also compiles TypeScript (tsc -b) before bundling.
      - name: Build
        run: npm run build
